[package]
name = "oshicolor-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "wallust v4 color extraction reconstructed for WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
palette = { version = "0.7", default-features = false, features = ["serializing"] }
kmeans_colors = { version = "0.7", default-features = false, features = ["palette_color"] }
fastrand = "2.4"
itertools = "0.14"
anyhow = "1.0"
rayon = "1.10"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]
